<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
</head>
<body>
    
    <h2>Formulário de Aluno</h2>

    <!-- Formulário vinculado ao objeto "aluno" enviado pelo Controller (th:object).
         O method POST envia os dados para o endpoint /alunoCTR/salvarAluno -->
    <form th:action="@{/alunoCTR/salvarAluno}" th:object="${aluno}" method="POST">
        
        <!-- Campo oculto com o ID: importante para diferenciar cadastro (id nulo)
             de edição (id preenchido) -->
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required />
        </div>
        <br>
        
        <div>
            <label for="cpf">CPF:</label>
            <!-- Alterado de cpf_aluno para cpf -->
            <input type="text" id="cpf" th:field="*{cpf}" required />
        </div>
        <br>

        <div>
            <label for="email">E-mail:</label>
            <!-- Alterado de email_aluno para email -->
            <input type="email" id="email" th:field="*{email}" required />
        </div>
        <br>

        <button type="submit">Salvar Aluno</button>
    </form>

    <br>
    <!-- Ajustado também o link de voltar para corresponder ao seu Controller ("/listarTodosAlunos") -->
    <!-- Atenção: no AlunoController o endpoint real é "/alunoCTR/listarAlunos" (sem "Todos"),
         então este link provavelmente está apontando para uma rota que não existe -->
    <a th:href="@{/alunoCTR/listarTodosAlunos}">Voltar para a Listagem de Alunos</a>

</body>
</html>
