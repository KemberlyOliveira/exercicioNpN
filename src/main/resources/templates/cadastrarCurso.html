<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Curso</title>
</head>
<body>

    <h2>Formulário de Curso</h2>

    <!-- Formulário vinculado ao objeto "curso" enviado pelo Controller -->
    <form th:action="@{/curso/salvarCurso}" th:object="${curso}" method="POST">
        
        <!-- Campo oculto com o ID, usado para diferenciar cadastro de edição -->
        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="nome">Nome do Curso:</label>
            <input type="text" id="nome" th:field="*{nome}" required />
        </div>
        <br>
        
        <div>
            <label for="cargaHoraria">Carga Horária:</label>
            <!-- Atenção: no Entity Curso o campo "cargaHoraria" é do tipo String,
                 mas aqui o input é do tipo "number" -->
            <input type="number" id="cargaHoraria" th:field="*{cargaHoraria}" required />
        </div>
        <br>

        <div>
            <label for="descricao">Descrição (Ementa):</label>
            <input id="descricao" th:field="*{descricao}" size="40" required />
        </div>
        <br>

        <button type="submit">Salvar Curso</button>
    </form>

    <br>
    <!-- Atenção: no CursoController o endpoint real é "/curso/listarCursos",
         este link está apontando para "/curso/listarCurso" (sem "s"), que não existe -->
    <a th:href="@{/curso/listarCurso}">Voltar para a Listagem</a>

</body>
</html>
